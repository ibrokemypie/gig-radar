[project]
name = "live-shows"
version = "0.1.0"
description = "Gigs near you by the artists you listen to, on a page, by email and on your calendar."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
# Runtime is the standard library only: the image needs no installs.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "pyright>=1.1.400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--cov=live_shows --cov-report=term-missing --cov-branch"

[tool.coverage.report]
fail_under = 100
exclude_also = ["if __name__ == .__main__.:", "^\\s*\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These match the dashes and quotes sellers really print.
"live_shows/names.py" = ["RUF001"]
"live_shows/sources/moshtix.py" = ["RUF001"]
# Test data is long strings; the formatter wraps the code around them.
"tests/*" = ["E501", "RUF001"]

[tool.pyright]
pythonVersion = "3.13"
# The tests stand duck-typed fakes in for SMTP, IMAP and the web.
include = ["live_shows"]
